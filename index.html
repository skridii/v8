<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>IRONLOG</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">IRON<span>LOG</span></div>
    <div class="sub">4-DAY UPPER / LOWER · 6 WEEK CYCLE</div>
  </div>
  <button id="installBtn" class="ghost hidden">Install</button>
</header>

<main>
  <section class="week-panel">
    <div>
      <div class="cycle-nav">
        <button id="cyclePrev" class="cycle-btn hidden" aria-label="Előző ciklus">‹</button>
        <span class="eyebrow" id="cycleLabel">CURRENT CYCLE</span>
        <button id="cycleNext" class="cycle-btn hidden" aria-label="Következő ciklus">›</button>
      </div>
      <h1 id="weekTitle">WEEK 1</h1>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </section>

  <div id="cycleBanner"></div>
  <nav class="tabs" id="dayTabs"></nav>
  <section id="workout"></section>
</main>

<div id="timerOverlay" class="overlay hidden">
  <div class="timer-card">
    <div class="eyebrow">REST TIMER</div>
    <div id="timerValue">2:30</div>
    <div id="timerExercise">Rest before your next set</div>
    <div class="timer-actions">
      <button id="skipTimer" class="secondary">SKIP</button>
      <button id="add30" class="secondary">+30 SEC</button>
    </div>
  </div>
</div>

<div id="editOverlay" class="overlay edit-overlay hidden">
  <form class="timer-card edit-card" id="editForm" autocomplete="off">
    <div class="eyebrow" id="editEyebrow">GYAKORLAT CSERE</div>
    <div class="edit-title" id="editTitle"></div>
    <label class="field"><span>Gyakorlat neve</span><input id="editName" autocomplete="off" autocapitalize="words"></label>
    <label class="field"><span>Magyar név (nem kötelező)</span><input id="editHu" autocomplete="off"></label>
    <label class="field"><span>Ismétlés</span><input id="editReps" autocomplete="off" placeholder="2 × 8–10"></label>
    <label class="field"><span>Váltakozó gyakorlat minden 2. héten (nem kötelező)</span><input id="editAlt" autocomplete="off" autocapitalize="words" placeholder="pl. Incline Bench Press"></label>
    <div class="edit-help" id="editHelp"></div>
    <div class="timer-actions">
      <button type="button" id="editCancel" class="secondary">MÉGSE</button>
      <button type="submit" class="primary">MENTÉS</button>
    </div>
    <button type="button" id="editRemove" class="danger-link">Eltávolítás erről a napról</button>
  </form>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
